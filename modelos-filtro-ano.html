<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelos · Filtro de ano</title>
<style>
:root{--ink:#064e3b;--ink2:#0a6b51;--champ:#f8e7c9;--bg:#f7efe0;--surface:#fffdf8;--border:#eadcc0;--text:#0d2a21;--muted:#66705f;--soft:#efe5d2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:420px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0}
.lead{color:var(--muted);font-size:13px;margin:0 0 16px}
.m{margin-bottom:22px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--champ);background:var(--ink);border-radius:6px;padding:2px 7px}
.m h2{display:inline;font-size:14.5px;margin-left:6px}
.m p{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.phone{border-radius:18px;overflow:hidden;background:var(--bg);border:1px solid var(--border)}
.panel{background:radial-gradient(120% 90% at 92% -10%,rgba(248,231,201,.3),transparent 55%),linear-gradient(165deg,#043428,#0a6b51);color:var(--champ);padding:12px 14px 14px;border-radius:0 0 26px 26px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tt{font-size:17px;font-weight:800}
.sub{font-size:11.5px;opacity:.75}
.cur{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px}
.cur b,.cur span{font-size:12px;padding:5px 9px;border-radius:8px}
.cur b{background:var(--champ);color:var(--ink)}
.cur span{opacity:.8}
.body{padding:12px 14px 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--muted)}
.card b{display:block;color:var(--text);font-size:18px}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px}
.seg span{flex:1;text-align:center;padding:7px;font-size:13px;color:var(--muted);border-radius:9px}
.seg .on{background:var(--surface);color:var(--text);font-weight:800}
.seg.flat .on{box-shadow:none;border:1px solid var(--border)}
.seg.shadow .on{box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg.glass{background:rgba(255,255,255,.14)}
.seg.glass span{color:rgba(248,231,201,.8)}
.seg.glass .on{background:var(--champ);color:var(--ink)}
.float{margin:-18px 14px 0;position:relative;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.under{display:flex;gap:18px;border-bottom:1px solid var(--border);padding:0 4px}
.under span{padding:8px 2px;font-size:13.5px;color:var(--muted)}
.under .on{color:var(--ink);font-weight:800;border-bottom:3px solid var(--ink);margin-bottom:-1px}
.drop{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;background:rgba(255,255,255,.16);border-radius:8px;padding:3px 8px;margin-left:6px;vertical-align:2px}
.arrows{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px;font-weight:800;font-size:15px}
.arrows i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.pills{display:flex;gap:6px;justify-content:flex-end}
.pills span{font-size:12px;padding:4px 12px;border-radius:14px;border:1px solid var(--border);color:var(--muted);background:var(--surface)}
.pills .on{background:var(--ink);color:var(--champ);border-color:var(--ink);font-weight:800}
.chipy{display:flex;gap:6px;margin-top:10px}
.chipy span{font-size:12px;padding:4px 12px;border-radius:14px;border:1px solid rgba(248,231,201,.35);opacity:.85}
.chipy .on{background:var(--champ);color:var(--ink);opacity:1;font-weight:800;border-color:var(--champ)}
.gap{height:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Filtro de ano — 10 modelos</h1>
  <p class="lead">Mesma tela do Planejado × Realizado (tema Somax, cabeçalho Modelo 1). Só muda onde e como aparece o <b>2025 | 2026</b>.</p>
  <div id="m"></div>
</div>
<script>
const P = (inner = '', extra = '') => `<div class="panel"><div class="row"><div><div class="tt">Planejado × Realizado</div><div class="sub">Marcelo Grotti</div></div><div class="cur"><b>BRL</b><span>USD</span></div></div>${inner}</div>${extra}`;
const OBJ = `<div class="card">OBJETIVO<b>BRL 11.229.024</b></div>`;
const seg = cls => `<div class="seg ${cls}"><span>2025</span><span class="on">2026</span></div>`;
const M = [
  ['Dentro do painel (vidro)', 'O ano vira parte do painel verde, logo embaixo do título. Sem sombra nenhuma.', P(`<div class="gap"></div>${seg('glass')}`), OBJ],
  ['Chips no painel', 'Duas pílulas pequenas embaixo do título, dentro do verde.', P(`<div class="chipy"><span>2025</span><span class="on">2026</span></div>`), OBJ],
  ['Abaixo do painel, sem sombra', 'Igual ao de hoje, mas a opção marcada só com contorno fino (sem sombra).', P(), `${seg('flat')}<div class="gap"></div>${OBJ}`],
  ['Flutuando na borda do painel', 'Como a busca da lista de pedidos: o seletor fica por cima da borda do verde.', P('<div class="gap"></div><div class="gap"></div>'), `<div class="seg shadow float" style="background:var(--surface)"><span>2025</span><span class="on" style="background:var(--ink);color:var(--champ)">2026</span></div><div class="body" style="padding-top:12px">${OBJ}</div>`, true],
  ['Abas sublinhadas', 'Sem caixa: o ano marcado fica sublinhado, como abas.', P(), `<div class="under"><span>2025</span><span class="on">2026</span></div><div class="gap"></div>${OBJ}`],
  ['Menu no título', 'O ano vai ao lado do título ("2026 ▾"); tocar abre a lista de anos. Libera espaço.', `<div class="panel"><div class="row"><div><div class="tt">Planejado × Realizado<span class="drop">2026 ▾</span></div><div class="sub">Marcelo Grotti</div></div><div class="cur"><b>BRL</b><span>USD</span></div></div></div>`, OBJ],
  ['Setas ‹ 2026 ›', 'Setas no painel para voltar/avançar o ano — cabe muitos anos no futuro.', P(`<div class="arrows"><i>‹</i>2026<i>›</i></div>`), OBJ],
  ['Pílulas à direita', 'Pequeno, alinhado à direita, abaixo do painel; o resumo sobe.', P(), `<div class="pills"><span>2025</span><span class="on">2026</span></div><div class="gap"></div>${OBJ}`],
  ['Dentro do cartão do Objetivo', 'O ano fica no próprio cartão do resumo, no canto (o objetivo é do ano).', P(), `<div class="card"><div class="row"><span>OBJETIVO</span><span class="pills" style="gap:4px"><span style="padding:2px 9px">2025</span><span class="on" style="padding:2px 9px">2026</span></span></div><b>BRL 11.229.024</b></div>`],
  ['Junto com a moeda', 'Uma linha de controles no painel: ano à esquerda, moeda à direita.', `<div class="panel"><div class="tt">Planejado × Realizado</div><div class="sub">Marcelo Grotti</div><div class="row" style="margin-top:10px"><div class="cur"><span>2025</span><b>2026</b></div><div class="cur"><b>BRL</b><span>USD</span></div></div></div>`, OBJ]
];
document.getElementById('m').innerHTML = M.map(([t, d, top, rest, raw], i) => `<div class="m"><span class="tag">MODELO ${i + 1}</span><h2>${t}</h2><p>${d}</p>
  <div class="phone">${top}${raw ? rest : `<div class="body">${rest}</div>`}</div></div>`).join('');
</script>
</body>
</html>

  datepick: async b => {
    const hid = document.getElementById(b.dataset.t), f = hid.dataset.f, H = 40;
    const base = hid.value || (f === 'due' ? (SAFRA(S.draft.safraId)?.due || today()) : today());
    const d0 = parseD(base), st = {d: d0.getDate(), m: d0.getMonth(), y: d0.getFullYear()};
    const yNow = new Date().getFullYear(), years = [];
    for(let y = Math.min(yNow - 1, st.y); y <= Math.max(yNow + 3, st.y); y++) years.push(y);
    const months = [...Array(12)].map((_, k) => { const m = new Intl.DateTimeFormat(loc(), {month: 'short'}).format(new Date(2000, k, 1)).replace('.', ''); return m[0].toUpperCase() + m.slice(1); });
    const dim = () => new Date(st.y, st.m + 1, 0).getDate();
    const days = () => [...Array(dim())].map((_, k) => String(k + 1).padStart(2, '0'));
    const cells = (items, sel) => items.map((x, k) => `<div data-k="${k}" class="${k === sel ? 'sel' : ''}">${x}</div>`).join('');
    const body = `<div class="wheels">
      <div class="wheel" data-w="d">${cells(days(), st.d - 1)}</div>
      <div class="wheel" data-w="m">${cells(months, st.m)}</div>
      <div class="wheel" data-w="y">${cells(years, years.indexOf(st.y))}</div></div>`;
    const buttons = [...(f === 'deliveryDate' && hid.value ? [{label: t('clear'), value: 'clear'}] : []),
      {label: t('cancel'), value: 'no'}, {label: 'OK', value: 'ok', kind: 'primary'}];
    const pr = modal({title: b.dataset.lbl, body, buttons, sheet: true});
    const ov = document.getElementById('overlay');
    const W = {d: ov.querySelector('[data-w=d]'), m: ov.querySelector('[data-w=m]'), y: ov.querySelector('[data-w=y]')};
    const idx = w => Math.max(0, Math.min(w.children.length - 1, Math.round(w.scrollTop / H)));
    const read = n => { const k = idx(W[n]); if(n === 'd') st.d = k + 1; else if(n === 'm') st.m = k; else st.y = years[k]; return k; };
    const fixDays = () => {
      const max = dim(); if(W.d.children.length === max) return;
      st.d = Math.min(st.d, max); W.d.innerHTML = cells(days(), st.d - 1); W.d.scrollTop = (st.d - 1) * H;
    };
    W.d.scrollTop = (st.d - 1) * H; W.m.scrollTop = st.m * H; W.y.scrollTop = years.indexOf(st.y) * H;
    Object.entries(W).forEach(([n, w]) => {
      let tm;
      w.addEventListener('scroll', () => { clearTimeout(tm); tm = setTimeout(() => {
        const k = read(n); [...w.children].forEach((c, j) => c.classList.toggle('sel', j === k));
        if(n !== 'd') fixDays();
      }, 70); }, {passive: true});
      w.addEventListener('click', e => { const c = e.target.closest('[data-k]'); if(c) w.scrollTo({top: +c.dataset.k * H, behavior: 'smooth'}); });
    });
    ov.addEventListener('click', e => { if(e.target.closest('[data-m="ok"]')){ read('m'); read('y'); read('d'); st.d = Math.min(st.d, dim()); } }, true);
    const r = await pr;
    if(!r || r.v === 'no') return;
    if(r.v === 'clear') hid.value = '';
    else {
      hid.value = `${st.y}-${String(st.m + 1).padStart(2, '0')}-${String(st.d).padStart(2, '0')}`; }
    hid.dispatchEvent(new Event('change', {bubbles: true}));
  },

/* ---------- Segurar o produto (digitação) = excluir ---------- */
(function longPress(){
  let tm = null, fired = false, x0 = 0, y0 = 0;
  const cancel = () => { clearTimeout(tm); tm = null; };
  document.addEventListener('pointerdown', e => {
    // digitação (Produtos): segurar o produto pergunta se quer excluir
    const item = S.view === 'editor' && e.target.closest('.card.item');
    if(!item) return;
    if(e.target.closest('input,select,textarea,button:not(.item-head)')) return;
    fired = false; x0 = e.clientX; y0 = e.clientY; cancel();
    tm = setTimeout(() => { fired = true; tm = null; try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
      const id = item.querySelector('.item-head')?.dataset.id, i = S.draft ? S.draft.items.findIndex(x => x.id === id) : -1;
      if(i >= 0) ACT['del-item']({dataset: {i: String(i)}}); }, 550);
  });
  document.addEventListener('pointermove', e => { if(tm && Math.hypot(e.clientX - x0, e.clientY - y0) > 10) cancel(); });
  document.addEventListener('pointerup', cancel); document.addEventListener('pointercancel', cancel);
  // depois de segurar, o toque não abre/fecha o produto
  document.addEventListener('click', e => { if(fired && e.target.closest('.card.item')){ e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
  document.addEventListener('contextmenu', e => { if(e.target.closest('.card.item .item-head')) e.preventDefault(); });
})();

/* ---------- Arrastar entre etapas ---------- */
(function swipe(){
  let x0 = 0, y0 = 0, dx = 0, on = false, horiz = null, body = null;
  document.addEventListener('touchstart', e => {
    body = e.target.closest('#step-body');
    if(!body || S.view !== 'editor' || e.touches.length > 1 || document.getElementById('overlay').classList.contains('open')) { body = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; horiz = null; on = true;
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if(!on || !body) return;
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if(horiz === null && (Math.abs(mx) > 10 || Math.abs(my) > 10)) horiz = Math.abs(mx) > Math.abs(my) * 1.4;
    if(!horiz) return;
    dx = mx;
    const edge = (dx > 0 && S.step === 1) || (dx < 0 && S.step === 3);   // resistência nas pontas
    body.style.transition = 'none';
    body.style.transform = `translateX(${edge ? dx * 0.15 : dx * 0.45}px)`;
    body.style.opacity = String(1 - Math.min(Math.abs(dx) / 900, .25));
  }, {passive: true});
  document.addEventListener('touchend', () => {
    if(!on || !body) return; on = false;
    const b = body; body = null;
    b.style.transition = 'transform .2s ease, opacity .2s ease'; b.style.transform = ''; b.style.opacity = '';
    if(!horiz || Math.abs(dx) < 70) return;
    if(dx < 0 && S.step < 3) gotoStep(S.step + 1);
    else if(dx > 0 && S.step > 1){ S.anim = 'prev'; S.step--; go(); }
  });
})();

document.addEventListener('input', e => {
  if(e.target.matches('[data-search]')){ S.q = e.target.value; render(); }
  if(e.target.matches('.qv input')) fitQty(e.target);
  // máscara de dinheiro no preço praticado: os dígitos entram pela direita (3250 → 32,50)
  if(e.target.matches('[data-f="price"]')){
    const digits = e.target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
    e.target.value = digits ? fmtNum(parseInt(digits, 10) / 100, 2) : '';
  }
});

/* ---------- Alterações de campos do pedido ---------- */
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-f]'); if(!el || !S.draft) return;
  const o = S.draft, f = el.dataset.f, v = el.value;
  const it = el.dataset.i != null ? o.items[+el.dataset.i] : null;
  switch(f){
    case 'unit': { const old = o.unit; o.unit = v; o.items.forEach(x => { if(x.deliveryUnit === old) x.deliveryUnit = v; }); break; }
    case 'clientId': o.clientId = v; o.contact = ''; o.deliveryPlace = ''; o.billingPlace = ''; o.billing = ''; o.items.forEach(x => x.deliveryPlace = ''); creditToast(); break;
    case 'safraId': case 'currency': {
      if(o.items.some(x => x.productId) &&
        await ask(t('c_table_t'), t('c_table_m'), [BACK_BTN(), {label: t('confirm'), value: 'yes', kind: 'primary'}]) !== 'yes'){ render(); return; }
      o[f] = v;
      const tb = TABLES.find(x => x.safraId === o.safraId && x.currency === o.currency);
      o.priceTableId = tb ? tb.id : '';
      if(o.cond && !isBonif(o)) o.due = dueFor(o.cond, o.safraId, o.date);
      o.items.forEach(x => { x.manual = false; recalcItem(o, x); });
      if(f === 'safraId') creditToast();
      break;
    }
    case 'cond': {
      let recalc = false;
      if(o.items.some(x => x.manual)){
        const r = await ask(t('c_cond_t'), t('c_cond_m'), [BACK_BTN(), {label: t('keep'), value: 'keep'}, {label: t('recalc'), value: 'recalc', kind: 'primary'}]);
        if(r !== 'keep' && r !== 'recalc'){ render(); return; }
        recalc = r === 'recalc';
      }
      o.cond = v; o.due = isBonif(o) ? '' : dueFor(v, o.safraId, o.date);
      o.items.forEach(x => { if(recalc) x.manual = false; recalcItem(o, x); });
      break;
    }
    case 'due': o.due = v; o.items.forEach(x => recalcItem(o, x)); if(v && v < o.date) toast(t('e_due_past'), 'warn'); break;
    case 'priceTableId': {
      // com produtos já lançados, confirma antes (os preços são refeitos pela nova tabela, inclusive os digitados)
      if(o.items.some(x => x.productId) &&
        await ask(t('c_table_t'), t('c_table_m'), [BACK_BTN(), {label: t('confirm'), value: 'yes', kind: 'primary'}]) !== 'yes'){ render(); return; }
      o.priceTableId = v; o.items.forEach(x => { x.manual = false; recalcItem(o, x); }); break;
    }
    case 'billing': { const old = o.billing; o.billing = v; o.items.forEach(x => { if(!x.deliveryPlace || x.deliveryPlace === old) x.deliveryPlace = v; }); break; }
    case 'itemPlace': it.deliveryPlace = v; break;
    case 'negType': o.negType = v; o.due = isBonif(o) || !o.cond ? '' : dueFor(o.cond, o.safraId, o.date); o.items.forEach(x => recalcItem(o, x)); break;
    case 'note': case 'docType': case 'deliveryPlace': case 'billingPlace': case 'contact': o[f] = v; break;
    case 'itemGroup': {
      // já tem produto que não é dessa linha: confirma antes de limpar
      if(v && PROD(it.productId) && PROD(it.productId).group !== v &&
        await ask(t('c_chg_t'), t('c_chg_m'), [BACK_BTN(), {label: t('change'), value: 'yes', kind: 'danger'}]) !== 'yes'){ render(); return; }
      it.group = v;
      if(v && it.activeId && !PRODUCTS.some(x => x.active === it.activeId && x.group === v)) it.activeId = '';
      if(v && PROD(it.productId) && PROD(it.productId).group !== v){ it.productId = ''; it.price = 0; it.manual = false; }
      break;
    }
    case 'activeId': {
      if(PROD(it.productId) && PROD(it.productId).active !== v &&
        await ask(t('c_chg_t'), t('c_chg_m'), [BACK_BTN(), {label: t('change'), value: 'yes', kind: 'danger'}]) !== 'yes'){ render(); return; }
      it.activeId = v;
      if(v && !it.group) it.group = (PRODUCTS.find(x => x.active === v) || {}).group || '';
      if(v && PROD(it.productId) && PROD(it.productId).active !== v){ it.productId = ''; it.price = 0; it.manual = false; }
      break;
    }
    case 'productId': setProduct(o, it, v); break;
    case 'qty': {
      const q = parseDec(v); it.qty = q || '';
      break;
    }
    case 'price': {
      const pv = r2(parseDec(v)), adj = adjPrice(o, it);
      it.price = pv; it.manual = adj == null || Math.abs(pv - adj) > 0.004;
      break;
    }
    case 'deliveryUnit': it.deliveryUnit = v; break;
    case 'deliveryDate': it.deliveryDate = v; break;
    case 'itemNote': it.note = v; break;
    case 'itemNoteDeliv': it.noteDeliv = v; break;
  }
  render();
});

/* ---------- PDF (arquivo) ---------- */
let pdfLibP = null;
function loadScript(src){ return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }); }
function loadPdfLib(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  return pdfLibP = pdfLibP || loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(() => loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'));
}
/* ---------- Relatório do pedido (A4, medidas em mm) ----------
   Um desenho só — uma lista de operações por página — vira a pré-visualização na tela (SVG) e o PDF (jsPDF),
   então a tela, o arquivo e a impressão saem iguais. A paginação é feita aqui: nenhuma linha de produto é cortada,
   o cabeçalho da tabela se repete na página seguinte e título de seção não fica sozinho no fim da página. */
const RP = {W: 210, H: 297, M: 14, TOP2: 30, BOTTOM: 278,
  INK: [24, 33, 27], TXT: [62, 72, 66], MUTED: [112, 122, 116], SOFT: [146, 154, 149], LINE: [224, 229, 226], PAPER: [247, 248, 247]};
const RP_BRAND = {somax: [39, 91, 59], corteva: [23, 93, 227]};   // cores tiradas das logos
const RP_ST = {aberto: [184, 126, 0], correcao: [200, 98, 26], aprovacao: [123, 75, 196], aprovado: [28, 140, 76], reprovado: [200, 56, 56]};
// condições gerais de venda: texto padrão, sai em todos os pedidos
const TERMS = {
  pt: ['Este pedido está sujeito à prévia aprovação da vendedora, sem a qual não poderá ser considerado como aceito. Em caso de aceitação, o presente pedido já constitui um contrato de compra e venda.',
    'A vendedora não se responsabilizará por atrasos e descumprimentos dos prazos de entrega das mercadorias quando estes forem ocasionados por ação ou omissão de terceiros, bem como em casos fortuitos ou de força maior.',
    'As mercadorias compradas serão consideradas definitivamente aceitas pelo comprador, em qualidade e quantidade, no momento da entrega, retirada ou recebimento. Nesse momento, deverá ser registrada qualquer eventual irregularidade.',
    'O comprador deverá seguir rigorosamente as indicações técnicas fornecidas pela vendedora ou por seus consultores técnicos de vendas para o uso e aplicação dos produtos.'],
  es: ['Este pedido está sujeto a la aprobación previa de la vendedora, sin la cual no podrá considerarse aceptado. En caso de aceptación, el presente pedido ya constituye un contrato de compraventa.',
    'La vendedora no se responsabilizará por atrasos e incumplimientos de los plazos de entrega de las mercaderías cuando estos sean ocasionados por acción u omisión de terceros, así como en casos fortuitos o de fuerza mayor.',
    'Las mercaderías compradas se considerarán definitivamente aceptadas por el comprador, en calidad y cantidad, en el momento de la entrega, retiro o recepción. En ese momento deberá registrarse cualquier eventual irregularidad.',
    'El comprador deberá seguir rigurosamente las indicaciones técnicas proporcionadas por la vendedora o por sus asesores técnicos de ventas para el uso y la aplicación de los productos.']
};
const rpTint = (c, k) => c.map(v => Math.round(v + (255 - v) * k));
// medida do texto com as mesmas fontes do PDF (Helvetica do jsPDF)
let rpMw = null;
function rpMeasure(){
  if(rpMw) return rpMw;
  const d = new window.jspdf.jsPDF({unit: 'mm', format: 'a4'});
  return rpMw = (s, size, bold) => { d.setFont('helvetica', bold ? 'bold' : 'normal'); d.setFontSize(size); return d.getTextWidth(String(s)); };
}
// "Fazenda Santa Rita - Londrina/PR" → ['Fazenda Santa Rita', 'Londrina', 'PR']
function rpPlace(name){
  const i = (name || '').lastIndexOf(' - '), nm = i > 0 ? name.slice(0, i) : (name || ''), rest = i > 0 ? name.slice(i + 3) : '';
  const [city = '', uf = ''] = rest.split('/'); return [nm, city, uf];
}

function reportPages(o){
  const mw = rpMeasure(), {W, M, INK, TXT, MUTED, SOFT, LINE} = RP, CW = W - 2 * M, R = W - M, WHITE = [255, 255, 255];
  const co = SELLER(o.sellerId)?.company, brand = RP_BRAND[co] || [31, 122, 74], light = rpTint(brand, .93), mid = rpTint(brand, .7);
  const c = orderCalc(o), cl = CLIENT(o.clientId) || {}, sf = SAFRA(o.safraId), cur = CUR_SYM[o.currency] || '';
  const items = o.items.filter(it => it.productId), logo = LOGOS[co], issued = fmtDT(new Date().toISOString());
  const place = id => placesOf(o.clientId).find(x => x.id === id)?.name || '';
  const pages = []; let ops = null, y = 0;

  // ---- primitivas ----
  const tw = (s, size, bold, cs = 0) => mw(s, size, bold) + cs * Math.max(0, String(s).length - 1);
  const text = (s, x, yy, {size = 8.6, bold = false, color = INK, align = 'left', cs = 0} = {}) => {
    s = String(s ?? ''); if(!s) return;
    const w = tw(s, size, bold, cs);
    ops.push({k: 't', s, x: align === 'right' ? x - w : align === 'center' ? x - w / 2 : x, y: yy, size, bold, color, cs});
  };
  // cabe na largura: diminui a fonte até o mínimo; se ainda não couber, corta com reticências (nunca quebra a linha)
  const fit = (s, maxW, size, bold = false, min = 6.6, cs = 0) => {
    s = String(s ?? ''); let z = size;
    while(z > min && tw(s, z, bold, cs) > maxW) z = Math.round((z - .2) * 10) / 10;
    if(tw(s, z, bold, cs) > maxW){ while(s.length > 1 && tw(s + '…', z, bold, cs) > maxW) s = s.slice(0, -1); s = s.trimEnd() + '…'; }
    return {s, size: z};
  };
  const wrap = (s, maxW, size, bold = false) => {
    const out = [];
    String(s || '').split('\n').forEach(par => { let ln = '';
      par.split(/\s+/).filter(Boolean).forEach(w => { const tt = ln ? ln + ' ' + w : w;
        if(!ln || mw(tt, size, bold) <= maxW) ln = tt; else { out.push(ln); ln = w; } });
      if(ln) out.push(ln); });
    return out;
  };
  const rect = (x, yy, w, h, fill, r = 0) => ops.push({k: 'r', x, y: yy, w, h, fill, r});
  const line = (x1, y1, x2, y2, color = LINE, lw = .2) => ops.push({k: 'l', x1, y1, x2, y2, color, lw});
  const img = (src, x, yy, w, h) => src && ops.push({k: 'i', src, x, y: yy, w, h});
  const cap = s => String(s || '').toUpperCase();

  // ---- páginas ----
  const contHeader = () => {   // páginas seguintes: cabeçalho compacto para identificar o pedido
    const icons = (co === 'corteva' ? [LOGOS.corteva, LOGOS.somax] : [logo]).filter(Boolean);
    icons.forEach((src, i) => img(src, M + i * 10.5, 10.5, 9, 9));
    const x = M + icons.length * 10.5 + (icons.length ? 1.5 : 0);
    text(`${cap(t('rp_title'))}  ·  ${t('rp_no')} ${o.number}`, x, 14.8, {size: 8.8, bold: true, cs: .15});
    text(fit(cl.name, 120, 7.4).s, x, 19, {size: 7.4, color: MUTED});
    text(companyOf(o), R, 14.8, {size: 8.6, bold: true, color: brand, align: 'right'});
    line(M, 23.2, R, 23.2, LINE, .25);
  };
  const newPage = () => { ops = []; pages.push(ops); if(pages.length > 1){ contHeader(); y = RP.TOP2; } };
  const ensure = h => { if(y + h > RP.BOTTOM) newPage(); };
  // título de seção: rótulo em caixa alta na cor da marca + fio até a margem; exige espaço para o título e o começo do conteúdo
  const section = (label, need = 12, x = M, w = CW) => {
    if(x === M && w === CW) ensure(need + 8);
    const L = cap(label), cs = .38;
    text(L, x, y + 3.2, {size: 6.9, bold: true, color: brand, cs});
    const lx = x + tw(L, 6.9, true, cs) + 2.5; if(lx < x + w - 2) line(lx, y + 2.2, x + w, y + 2.2, LINE, .25);
    return y + 6.8;
  };
  // grade de campos: rótulo pequeno e claro em cima, valor maior embaixo; campos podem ocupar mais de uma coluna
  const grid = (rows, cols = 4) => {
    const gap = 5, cw = (CW - gap * (cols - 1)) / cols;
    rows.forEach(row => { ensure(9.8); let col = 0;
      row.forEach(([lbl, val, span = 1, st = {}]) => {
        const x = M + col * (cw + gap), w = cw * span + gap * (span - 1);
        const l = fit(cap(lbl), w, 5.9, true, 5, .22);
        text(l.s, x, y + 2.6, {size: l.size, bold: true, color: SOFT, cs: .22});
        const v = fit(val || '—', w, st.size || 8.8, !!st.bold);
        text(v.s, x, y + 6.9, {size: v.size, bold: !!st.bold, color: val ? INK : SOFT});
        col += span; });
      y += 9.8; });
  };

  // ================= 1. Cabeçalho =================
  newPage();
  if(co === 'corteva' && LOGOS.corteva_full){
    // Corteva: logo completa da Corteva junto com a logo completa da Somax
    img(LOGOS.corteva_full, M, 12.4, 48.5, 9.6);
    line(M + 52.5, 11.5, M + 52.5, 27.5, LINE, .3);
    img(LOGOS.somax_full, M + 56.5, 11.6, 30.5, 11.5);
    text(`${t('unit')} ${UNIT(o.unit)?.name || ''}`, M, 27.2, {size: 7.8, color: MUTED});
  } else if(co === 'somax' && LOGOS.somax_full){
    // Somax: logo completa (símbolo + nome) e a filial embaixo
    img(LOGOS.somax_full, M, 11, 37, 14);
    text(`${t('unit')} ${UNIT(o.unit)?.name || ''}`, M, 28.4, {size: 7.8, color: MUTED});
  } else {
    if(logo) img(logo, M, 11, 18, 18);
    const hx = M + (logo ? 22 : 0);
    text(companyOf(o) || t('pdf_company'), hx, 18.6, {size: 13.5, bold: true});
    text(`${t('unit')} ${UNIT(o.unit)?.name || ''}`, hx, 23.6, {size: 7.8, color: MUTED});
  }
  text(cap(t('rp_title')), R, 17.4, {size: 14.5, bold: true, align: 'right', cs: .55});
  const nTxt = `${t('rp_no')} ${o.number}`, nW = tw(nTxt, 11.5, true) + 10;
  rect(R - nW, 20.4, nW, 8.4, brand, 1.8);
  text(nTxt, R - nW / 2, 26.15, {size: 11.5, bold: true, color: WHITE, align: 'center'});
  line(M, 33, R, 33, LINE, .3); rect(M, 32.4, 34, 1.2, brand);
  // faixa com os dados principais do documento
  const info = [[t('rp_issued'), issued], [t('mov_date'), movDT(o)], [t('safra'), sf?.name], [t('currency'), t('cur_' + o.currency)],
    [t('neg_type'), t('neg_' + o.negType)], [t('status'), t('st_' + o.status), RP_ST[o.status]]];
  const iy = 36, ih = 12.4, iw = CW / info.length;
  rect(M, iy, CW, ih, light, 2);
  info.forEach(([k, v, col], i) => { const x = M + i * iw + 3.4, w = iw - 5.6;
    if(i) line(M + i * iw, iy + 3, M + i * iw, iy + ih - 3, mid, .2);
    const l = fit(cap(k), w, 5.6, true, 4.8, .2); text(l.s, x, iy + 4.9, {size: l.size, bold: true, color: MUTED, cs: .2});
    const f = fit(v || '—', w, 8.2, true, 6.4); text(f.s, x, iy + 9.6, {size: f.size, bold: true, color: col || INK}); });
  y = iy + ih + 3.4;

  // ================= 2. Dados do cliente =================
  y = section(t('rp_client'), 22);
  // mesmo local de faturamento e de cobrança (o comum) vira um campo só; o vendedor está na assinatura
  const sameBill = !o.billingPlace || o.billingPlace === o.billing;
  grid([
    [[t('client'), cl.name, 2, {bold: true, size: 9.6}], [t('client_doc'), cl.doc], [t('contact'), contactName(o)]],
    [[sameBill ? t('rp_bill_both') : t('billing'), billName(o), 2], [t('city'), cl.city], [t('due'), isBonif(o) ? t('rp_no_due_s') : (o.due ? fmtDate(o.due) : '')]],
    ...(sameBill ? [] : [[[t('billing_place'), billPlaceName(o), 2]]])
  ]);

  // ================= 3. Dados de entrega =================
  // a entrega é por produto: aqui vai o local e a unidade mais usados; o produto com outro local mostra o dele na tabela
  const most = arr => { const n = {}; arr.forEach(v => { if(v) n[v] = (n[v] || 0) + 1; }); return Object.keys(n).sort((a, b) => n[b] - n[a])[0] || ''; };
  const mainPlace = most(items.map(it => it.deliveryPlace || o.billing)), mainUnit = most(items.map(it => it.deliveryUnit || o.unit));
  const [pName, pCity, pUf] = rpPlace(place(mainPlace));
  const dts = items.map(it => it.deliveryDate).filter(Boolean).sort();
  const fc = !dts.length ? '' : dts[0] === dts[dts.length - 1] ? fmtDate(dts[0]) : `${fmtDate(dts[0])} – ${fmtDate(dts[dts.length - 1])}`;
  y += 1.2; y = section(t('rp_delivery'), 22);
  grid([
    [[t('rp_freight'), o.freight || ''], [t('rp_branch'), UNIT(mainUnit)?.name], [t('rp_forecast'), fc], [t('rp_state'), pUf]],
    [[t('rp_address'), pName, 2], [t('rp_district'), o.district || ''], [t('rp_city'), pCity]]
  ]);

  // ================= 4. Produtos =================
  const cols = [{w: 21, a: 'left'}, {w: 0, a: 'left'}, {w: 27, a: 'center'}, {w: 30, a: 'right'}, {w: 32, a: 'right'}];
  cols[1].w = CW - cols.reduce((a, x) => a + x.w, 0);
  const heads = [t('rp_code'), t('rp_desc'), t('rp_qty'), `${t('rp_unit_price')} (${cur})`, `${t('rp_total_price')} (${cur})`];
  const colX = []; cols.reduce((x, col, i) => (colX[i] = x, x + col.w), M);
  const PX = 2.4, cx = i => cols[i].a === 'right' ? colX[i] + cols[i].w - PX : cols[i].a === 'center' ? colX[i] + cols[i].w / 2 : colX[i] + PX;
  const thead = () => { rect(M, y, CW, 7.4, light, 1.4);
    heads.forEach((h, i) => { const f = fit(cap(h), cols[i].w - 2 * PX, 6.1, true, 4.8, .2);
      text(f.s, cx(i), y + 4.85, {size: f.size, bold: true, color: brand, align: cols[i].a, cs: .2}); });
    y += 7.4; };
  y += 1.2; y = section(t('rp_items'), 26); thead();
  const dw = cols[1].w - 2 * PX;
  items.forEach(it => {
    const p = PROD(it.productId), ic = itemCalc(o, it);
    const sub = [ACTIVE(p.active).name, it.deliveryDate ? `${t('rp_deliv')} ${fmtDate(it.deliveryDate)}` : '',
      it.deliveryPlace && it.deliveryPlace !== mainPlace ? rpPlace(place(it.deliveryPlace))[0] : '', it.note || ''].filter(Boolean).join('  ·  ');
    const subL = wrap(sub, dw, 6.8).slice(0, 3), h = 7.1 + subL.length * 2.8 + 1.1;
    if(y + h > RP.BOTTOM){ newPage(); thead(); }   // linha inteira na página seguinte, com o cabeçalho da tabela de novo
    const by = y + 4.8;
    text(fit(p.id.toUpperCase(), cols[0].w - 2 * PX, 7.2).s, cx(0), by, {size: 7.2, color: MUTED});
    const nm = fit(p.name, dw, 8.5, true); text(nm.s, cx(1), by, {size: nm.size, bold: true});
    subL.forEach((l, j) => text(l, cx(1), by + 3.3 + j * 2.8, {size: 6.8, color: MUTED}));
    const q = fit(`${fmtNum(ic.qty)} ${p.um}`, cols[2].w - 2 * PX, 8.5); text(q.s, cx(2), by, {size: q.size, align: 'center'});
    const up = fit(fmtNum(ic.price, 2), cols[3].w - 2 * PX, 8.5); text(up.s, cx(3), by, {size: up.size, align: 'right'});
    const tp = fit(fmtNum(ic.total, 2), cols[4].w - 2 * PX, 8.5, true); text(tp.s, cx(4), by, {size: tp.size, bold: true, align: 'right'});
    y += h; line(M, y, R, y, LINE, .2);
  });

  // ================= 5–7. Condição de pagamento, vencimentos e total =================
  const tab = items.reduce((a, it) => { const ic = itemCalc(o, it); return a + (ic.adj || 0) * (ic.qty || 0); }, 0), discV = Math.max(0, tab - c.total);
  ensure(34); y += 5;
  const y0 = y, C1 = 44, C2 = 62, GAP = 7, X2 = M + C1 + GAP, X3 = X2 + C2 + GAP, W3 = R - X3;
  // condição de pagamento: código | condição e, embaixo, o documento de cobrança
  let yc = section(t('rp_pay'), 0, M, C1);
  const half = (C1 - 4) / 2;
  [[t('rp_code'), o.cond ? o.cond.toUpperCase() : '', M, half, 0], [t('cond_short'), o.cond ? t('cond_' + o.cond) : '', M + half + 4, half, 0],
   [t('doc_type'), o.docType ? t('doc_' + o.docType) : '', M, C1, 9.8]].forEach(([k, v, x, w, dy]) => {
    text(fit(cap(k), w, 5.9, true, 5, .22).s, x, yc + dy + 2.6, {size: 5.9, bold: true, color: SOFT, cs: .22});
    const f = fit(v || '—', w, 8.8); text(f.s, x, yc + dy + 6.9, {size: f.size, color: v ? INK : SOFT}); });
  // vencimentos: prazo, data e valor
  let yv = section(t('rp_dues'), 0, X2, C2);
  const vx = [X2 + PX, X2 + 21, X2 + C2 - PX];
  rect(X2, yv, C2, 6.4, light, 1.2);
  [[t('rp_term'), vx[0], 'left'], [t('rp_date'), vx[1], 'left'], [`${t('rp_value')} (${cur})`, vx[2], 'right']].forEach(([h, x, a]) =>
    text(cap(h), x, yv + 4.3, {size: 5.9, bold: true, color: brand, align: a, cs: .2}));
  yv += 6.4;
  if(isBonif(o) || !o.due) text(fit(isBonif(o) ? t('rp_no_due') : '—', C2 - 2 * PX, 7.8).s, vx[0], yv + 4.9, {size: 7.8, color: MUTED});
  else {
    const days = Math.round((parseD(o.due) - parseD(o.date)) / 864e5);
    text(days <= 0 ? t('cond_avista') : t('rp_days', days), vx[0], yv + 4.9, {size: 8.2});
    text(fmtDate(o.due), vx[1], yv + 4.9, {size: 8.2});
    const vv = fit(fmtNum(c.total, 2), C2 - 38, 8.2, true); text(vv.s, vx[2], yv + 4.9, {size: vv.size, bold: true, align: 'right'});
  }
  yv += 7; line(X2, yv, X2 + C2, yv, LINE, .2);
  // total: valor de tabela, desconto e o total do pedido em destaque
  let yr = y0 + .6;
  [[t('rp_list_value'), fmtMoney(tab, o.currency)], [`${t('rp_discount')} (${fmtPct(tab > 0 ? discV / tab : 0)})`, discV ? '- ' + fmtMoney(discV, o.currency) : fmtMoney(0, o.currency)]].forEach(([k, v]) => {
    text(fit(k, W3 - 26, 7.4).s, X3, yr + 3.6, {size: 7.4, color: MUTED}); text(fit(v, 30, 8.4).s, R, yr + 3.6, {size: 8.4, align: 'right'});
    yr += 5.8; line(X3, yr, R, yr, LINE, .2); });
  yr += 2.4;
  rect(X3, yr, W3, 15.5, light, 2); rect(X3, yr, 1.3, 15.5, brand);
  text(fit(cap(t('rp_total')), W3 - 8, 6.2, true, 5, .3).s, X3 + 4.6, yr + 5.2, {size: 6.2, bold: true, color: brand, cs: .3});
  const tv = fit(fmtMoney(c.total, o.currency), W3 - 8, 14.5, true, 10);
  text(tv.s, R - 3.6, yr + 12.2, {size: tv.size, bold: true, color: brand, align: 'right'});
  y = Math.max(yc + 19.6, yv, yr + 15.5) + 1;

  // ================= 8–10. Observações / condições gerais e assinaturas (no pé da última página) =================
  const lang = S.lang === 'es' ? 'es' : 'pt', TW = CW - 10;
  const noteL = o.note ? wrap(o.note, TW, 7.8) : [];
  const termL = TERMS[lang].map(s => wrap(s, TW - 5, 6.4));
  const LH = 2.62, boxH = 3 + (noteL.length ? 4.2 + noteL.length * 3.3 + 2.6 : 0) + termL.reduce((a, l) => a + l.length * LH + 1, 0) + 1.1;
  const signH = o.signature ? 28 : 22.5, blockH = 6.8 + boxH + 5 + signH;
  // encosta no pé da última página; se não couber, vai inteiro para a página seguinte (logo abaixo do cabeçalho)
  const fits = y + 3 + blockH <= RP.BOTTOM;
  if(!fits) newPage(); else y = RP.BOTTOM - blockH;
  y = section(t('rp_terms'));
  rect(M, y, CW, boxH, RP.PAPER, 2);
  let yy = y + 3;
  if(noteL.length){
    text(cap(t('rp_note')), M + 5, yy + 2, {size: 5.9, bold: true, color: SOFT, cs: .22});
    noteL.forEach((l, i) => text(l, M + 5, yy + 6 + i * 3.3, {size: 7.8, color: INK}));
    yy += 4.2 + noteL.length * 3.3 + 2.6; line(M + 5, yy - 1.4, R - 5, yy - 1.4, LINE, .2);
  }
  termL.forEach((ls, i) => { text(`${i + 1}.`, M + 5, yy + 2.3, {size: 6.4, bold: true, color: brand});
    ls.forEach((l, j) => text(l, M + 10, yy + 2.3 + j * LH, {size: 6.4, color: TXT})); yy += ls.length * LH + 1; });
  y += boxH + 5;
  // assinaturas: cliente (com a assinatura coletada, se houver) e vendedor
  const sw = (CW - 16) / 2, sx = [M, M + sw + 16], ly = y + (o.signature ? 14.5 : 9.5);
  if(o.signature) img(o.signature, sx[0] + (sw - 50) / 2, y, 50, 14);
  [[t('rp_sign_client'), cl.name, cl.doc], [t('rp_seller'), SELLER(o.sellerId)?.name, `${companyOf(o)} · ${UNIT(o.unit)?.name || ''}`]].forEach(([k, n, d], i) => {
    const mx = sx[i] + sw / 2;
    line(sx[i], ly, sx[i] + sw, ly, SOFT, .3);
    text(cap(k), mx, ly + 3.8, {size: 5.9, bold: true, color: SOFT, align: 'center', cs: .22});
    text(fit(n || '—', sw, 8).s, mx, ly + 7.8, {size: 8, bold: true, align: 'center'});
    text(fit(d || '', sw, 6.8).s, mx, ly + 11.2, {size: 6.8, color: MUTED, align: 'center'});
  });
  if(o.signature && o.signedAt) text(`${t('signed_at')} ${fmtDT(o.signedAt)}`, sx[0] + sw / 2, ly + 14.4, {size: 6, color: SOFT, align: 'center'});

  // ================= rodapé: empresa, pedido, emissão e "Página X de Y" =================
  pages.forEach((pg, i) => { ops = pg;
    line(M, 284, R, 284, LINE, .25);
    text(`${companyOf(o) || t('pdf_company')}  ·  ${t('pdf_title')} ${t('rp_no')} ${o.number}  ·  ${t('rp_issued')} ${issued}`, M, 288.4, {size: 6.3, color: MUTED});
    text(t('rp_page', i + 1, pages.length), R, 288.4, {size: 6.6, bold: true, color: TXT, align: 'right'});
  });
  return pages;
}

// ---- saída 1: SVG (tela e impressão) ----
const rpRgb = c => `rgb(${c.join(',')})`, rpN = v => +v.toFixed(3);
function rpSvg(ops){
  return `<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><rect width="210" height="297" fill="#fff"/>${ops.map(op =>
    op.k === 't' ? `<text x="${rpN(op.x)}" y="${rpN(op.y)}" font-size="${rpN(op.size * .3528)}"${op.bold ? ' font-weight="700"' : ''} fill="${rpRgb(op.color)}"${op.cs ? ` letter-spacing="${op.cs}"` : ''} xml:space="preserve">${esc(op.s)}</text>`
    : op.k === 'r' ? `<rect x="${rpN(op.x)}" y="${rpN(op.y)}" width="${rpN(op.w)}" height="${rpN(op.h)}"${op.r ? ` rx="${op.r}"` : ''} fill="${rpRgb(op.fill)}"/>`
    : op.k === 'l' ? `<line x1="${rpN(op.x1)}" y1="${rpN(op.y1)}" x2="${rpN(op.x2)}" y2="${rpN(op.y2)}" stroke="${rpRgb(op.color)}" stroke-width="${op.lw}"/>`
    : `<image href="${op.src}" x="${rpN(op.x)}" y="${rpN(op.y)}" width="${op.w}" height="${op.h}" preserveAspectRatio="xMidYMid meet"/>`).join('')}</svg>`;
}
// ---- saída 2: PDF (jsPDF); imagens convertidas para PNG com transparência, mantendo a proporção ----
function rpImage(src){
  return new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / Math.max(im.naturalWidth, im.naturalHeight)),
    cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res({data: cv.toDataURL('image/png'), ratio: im.naturalWidth / im.naturalHeight}); };
    im.onerror = () => res(null); im.src = src; });
}
async function rpPdf(pages, o){
  const {jsPDF} = window.jspdf, doc = new jsPDF({unit: 'mm', format: 'a4', compress: true}), imgs = {};
  for(const pg of pages) for(const op of pg) if(op.k === 'i' && !(op.src in imgs)) imgs[op.src] = await rpImage(op.src);
  pages.forEach((pg, i) => { if(i) doc.addPage();
    pg.forEach(op => {
      if(op.k === 't'){ doc.setFont('helvetica', op.bold ? 'bold' : 'normal'); doc.setFontSize(op.size); doc.setTextColor(...op.color);
        doc.text(op.s, op.x, op.y, op.cs ? {charSpace: op.cs} : {}); }
      else if(op.k === 'r'){ doc.setFillColor(...op.fill); op.r ? doc.roundedRect(op.x, op.y, op.w, op.h, op.r, op.r, 'F') : doc.rect(op.x, op.y, op.w, op.h, 'F'); }
      else if(op.k === 'l'){ doc.setDrawColor(...op.color); doc.setLineWidth(op.lw); doc.line(op.x1, op.y1, op.x2, op.y2); }
      else { const im = imgs[op.src]; if(!im) return;
        const [w, h] = im.ratio > op.w / op.h ? [op.w, op.w / im.ratio] : [op.h * im.ratio, op.h];
        doc.addImage(im.data, 'PNG', op.x + (op.w - w) / 2, op.y + (op.h - h) / 2, w, h); }
    }); });
  doc.setProperties({title: `${t('pdf_title')} ${o ? o.number : ''}`.trim()});
  return doc;
}
// nome do arquivo: nº do pedido_nome do cliente_tipo de negociação_projeto.pdf
// (barra vira hífen — "26/27" → "26-27"; outros caracteres que o sistema de arquivos não aceita saem)
const rpName = o => [o.number, CLIENT(o.clientId)?.name || '', t('neg_' + o.negType), SAFRA(o.safraId)?.name || '']
  .map(x => String(x).replace(/[\\/]+/g, '-').replace(/[:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim()).filter(Boolean).join('_') + '.pdf';
// PDF do pedido (usado também pelo Enviar)
async function buildPdf(o){ await loadPdfLib(); return rpPdf(reportPages(o), o); }

// ---- tela do relatório: as páginas como aparecem no PDF; imprimir, baixar e enviar ----
async function openReport(o){
  if(!o) return;
  try{ await loadPdfLib(); }catch(e){ toast(t('pdf_fail'), 'bad'); return; }
  const pages = reportPages(o);
  S.rpt = {o, pages, svgs: pages.map(rpSvg), back: S.view};
  go('report');
}
function viewReport(){
  const r = S.rpt; if(!r) return '';
  return `<div class="edhead rpt-headbar"><div class="page-head ed-title"><button class="icon-btn back" data-a="rpt-back" aria-label="${t('back')}">${IC.back}</button><h1>${t('order_n', r.o.number)}</h1>
      ${CAN_PRINT ? `<button class="icon-btn" data-a="rpt-print" aria-label="${t('rp_print')}" title="${t('rp_print')}">${IC.printer}</button>` : '<span></span>'}</div></div>
    <div class="rpt-pages">${r.svgs.map((s, i) => `<div class="rpt-pg" role="img" aria-label="${esc(t('rp_page', i + 1, r.pages.length))}">${s}</div>`).join('')}</div>`;
}

// menu de envio: (Gerar PDF) · Enviar PDF · Enviar no WhatsApp; pedido não aprovado confirma antes de enviar
async function sendMenu(o, withGen){
  if(!o) return;
  if(CAN_PRINT) loadPdfLib().catch(() => {});   // já vai carregando, para o PDF sair na hora
  const body = `<div class="send-opts">${withGen ? `<button type="button" class="btn pdf block" data-m="gen">${IC.pdf}${t('gen_pdf')}</button>` : ''}
    <button type="button" class="btn block info" data-m="pdf">${IC.send}${t('send_pdf')}</button>
    <button type="button" class="btn block wa" data-m="wa">${IC.chat}${t('send_wa')}</button></div>`;
  const r = await modal({title: withGen ? t('order_n', o.number) : t('send_how'), body, buttons: [BACK_BTN()]}), v = r && r.v;
  if(v === 'gen') return openReport(o);
  if(v !== 'pdf' && v !== 'wa') return;
  if(!(await okToSend(o))) return;
  if(v === 'pdf') sendPdf(o); else waEdit(o);
}
// antes de enviar um pedido que ainda não foi aprovado: "Este pedido ainda não foi aprovado. Enviar mesmo assim?"
async function okToSend(o){
  if(!o || o.status === 'aprovado') return !!o;
  return await ask(t('c_send_unappr'), '', [BACK_BTN(), {label: t('send_btn'), value: 'yes', kind: 'info', icon: IC.send}]) === 'yes';
}
// enviar o relatório em PDF: menu de compartilhar do celular (WhatsApp, e-mail…); sem ele (computador), baixa o arquivo
async function sendPdf(o){
  if(!o) return;
  if(!CAN_PRINT){ openReport(o); return; }
  toast(t('pdf_making'));
  let doc = null;
  try{
    doc = await buildPdf(o);
    const name = rpName(o), file = new File([doc.output('blob')], name, {type: 'application/pdf'});
    if(navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return; }
    doc.save(name);
  }catch(e){
    if(e && e.name === 'AbortError') return;
    if(doc) doc.save(rpName(o)); else toast(t('pdf_fail'), 'bad');
  }
}
// resumo do pedido em texto para o WhatsApp: *negrito* nos títulos e valores, _itálico_ nas observações dos produtos
// (por padrão sem situação, documento de cobrança, valor de tabela e desconto — a pessoa pode editar antes de enviar)
function orderText(o){
  const c = orderCalc(o), cl = CLIENT(o.clientId) || {}, sf = SAFRA(o.safraId), items = o.items.filter(it => it.productId);
  const B = x => `*${x}*`, L = [], cur = v => fmtMoney(v, o.currency);
  const place = id => rpPlace(placesOf(o.clientId).find(x => x.id === id)?.name || '')[0];
  L.push(B(`${t('pdf_title').toUpperCase()} ${t('rp_no')} ${o.number}`), `${companyOf(o)} · ${t('unit')} ${UNIT(o.unit)?.name || ''}`, `${t('mov_date')}: ${movDT(o)}`);
  L.push('', B(t('client').toUpperCase()), cl.name || '—');
  if(cl.doc) L.push(`${t('client_doc')}: ${cl.doc}`);
  if(contactName(o)) L.push(`${t('contact')}: ${contactName(o)}`);
  if(billName(o)) L.push(`${t('billing')}: ${billName(o)}`);
  L.push('', B(t('g_neg').toUpperCase()), `${t('safra')}: ${sf?.name || '—'}`, `${t('currency')}: ${t('cur_' + o.currency)}`, `${t('neg_type')}: ${t('neg_' + o.negType)}`);
  if(o.cond) L.push(`${t('cond')}: ${t('cond_' + o.cond)}`);
  if(!isBonif(o) && o.due) L.push(`${t('due')}: ${fmtDate(o.due)}`);
  L.push('', B(`${t('items').toUpperCase()} (${items.length})`));
  items.forEach((it, i) => { const p = PROD(it.productId), ic = itemCalc(o, it);
    L.push(`${i + 1}. ${B(p.name)}`, `     ${ACTIVE(p.active).name}`, `     ${fmtNum(ic.qty)} ${p.um} × ${cur(ic.price)} = ${B(cur(ic.total))}`);
    const dv = [it.deliveryDate ? fmtDate(it.deliveryDate) : '', UNIT(it.deliveryUnit)?.name, it.deliveryPlace ? place(it.deliveryPlace) : ''].filter(Boolean).join(' · ');
    if(dv) L.push(`     ${t('rp_deliv')}: ${dv}`);
    if(it.note) L.push(`     _${it.note}_`); });
  L.push('', B(`${t('rp_total').toUpperCase()}: ${cur(c.total)}`));
  if(o.note) L.push('', `${B(t('note_order'))}: ${o.note}`);
  L.push('', `${t('seller')}: ${SELLER(o.sellerId)?.name || ''} (${companyOf(o)})`);
  return L.join('\n');
}
// WhatsApp: a mensagem pronta para editar e, embaixo, para quem enviar — os contatos do cliente (o do pedido primeiro),
// cada um com o celular e o botão verde do WhatsApp, ou "Outro contato" (a pessoa escolhe a conversa, ex.: o gestor)
function waEdit(o){
  if(!o) return;
  const cts = contactsOf(o.clientId).map(ct => ({...contactInfo(o.clientId, ct), label: ct.name})).sort((a, b) => (b.id === o.contact) - (a.id === o.contact));
  const body = `<textarea id="wa-msg" class="wa-msg" rows="14" aria-label="${t('wa_msg')}">${esc(orderText(o))}</textarea>
    <div class="pp-gh">${t('wa_to')}</div>
    <div class="ct-list">${cts.map(x => `<div class="ct">
      <div class="ct-who"><b>${esc(x.label)}</b>${x.id === o.contact ? `<span class="chip st-aprovado">${t('order_contact')}</span>` : ''}</div>
      <div class="ct-lines"><span>${IC.phone}${x.phone}</span></div>
      <div class="ct-acts"><button type="button" class="btn wa" data-wa="${x.wa}">${IC.chat}WhatsApp</button></div></div>`).join('')}
      <button type="button" class="btn block wa-other" data-wa="">${IC.chat}${t('wa_other')}</button></div>`;
  modal({title: t('wa_msg'), sheet: true, body});
  const ov = document.getElementById('overlay');
  ov.addEventListener('click', e => { const b = e.target.closest('[data-wa]'); if(!b) return;
    const text = ov.querySelector('#wa-msg').value; if(!text.trim()) return;
    const a = document.createElement('a'); a.href = `https://wa.me/${b.dataset.wa}?text=${encodeURIComponent(text)}`; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    if(closeOverlay) closeOverlay(); });
}
